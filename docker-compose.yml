services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-cvp}
      POSTGRES_USER: ${DB_USER:-cvp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cvp} -d ${DB_NAME:-cvp}"]
      interval: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  api1:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - SERVER_ID=api1
    volumes:
      - ./backend:/app
      - media:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  api2:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - SERVER_ID=api2
    volumes:
      - ./backend:/app
      - media:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A worker.app worker --concurrency=1 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - media:/data
    cpus: "2"
    labels:
      - "cvp.role=worker"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api1
      - api2

volumes:
  pgdata:
  media: