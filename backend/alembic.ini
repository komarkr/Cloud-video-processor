[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions
sqlalchemy.url = postgresql+psycopg://cvp:my_secret_password@postgres:5432/cvp

[post_write_hooks]
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(asctime)s] %(name)s: %(message)s
datefmt = %H:%M:%S

